<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Café del Bueno | Cafetería en Punta Arenas, Magallanes</title>
  <meta name="description" content="Café del Bueno es una cafetería de barrio en Punta Arenas, Magallanes. Café de especialidad, pastelería casera y pedidos directo por WhatsApp." />
  <meta name="keywords" content="cafetería Punta Arenas, café Punta Arenas, cafetería Magallanes, café de especialidad Punta Arenas, cafetería de barrio, Café del Bueno" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#9F6A33" />

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="canonical" href="https://cafedelbueno.cl/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Café del Bueno" />
  <meta property="og:title" content="Café del Bueno | Cafetería en Punta Arenas, Magallanes" />
  <meta property="og:description" content="Cafetería de barrio en Punta Arenas. Café de especialidad, pastelería casera y pedidos directo por WhatsApp." />
  <meta property="og:url" content="https://cafedelbueno.cl/" />
  <meta property="og:locale" content="es_CL" />
  <meta property="og:image" content="https://cafedelbueno.cl/og-image.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Café del Bueno | Cafetería en Punta Arenas, Magallanes" />
  <meta name="twitter:description" content="Cafetería de barrio en Punta Arenas. Café de especialidad, pastelería casera y pedidos directo por WhatsApp." />
  <meta name="twitter:image" content="https://cafedelbueno.cl/og-image.jpg" />

  <!-- Datos estructurados -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CafeOrCoffeeShop",
    "name": "Café del Bueno",
    "servesCuisine": "Café",
    "priceRange": "$$",
    "telephone": "+56999999999",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Bories 123",
      "addressLocality": "Punta Arenas",
      "addressRegion": "Magallanes y de la Antártica Chilena",
      "addressCountry": "CL"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": -53.1638,
      "longitude": -70.9171
    },
    "openingHoursSpecification": [
      { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "08:30", "closes": "20:00" },
      { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:00", "closes": "20:00" },
      { "@type": "OpeningHoursSpecification", "dayOfWeek": "Sunday", "opens": "10:00", "closes": "14:00" }
    ],
    "sameAs": [
      "https://www.instagram.com/cafedelbueno"
    ]
  }
  </script>

  <!-- CDN: Lucide (íconos) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Estilos: Tailwind ya compilado (sin CDN de producción) + estilos propios -->
  <link rel="stylesheet" href="tailwind.css" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Reseteo mínimo para que #root ocupe toda la altura */
    html, body { height: 100%; margin: 0; }
    #root { height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="script.js"></script>
</body>
</html>
